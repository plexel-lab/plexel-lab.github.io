<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta name="apple-itunes-app" content="app-id=6776291336">
  <title>Catch Log グループへの招待</title>
  <link rel="icon" href="/icons/catchlog.png">
  <style>
    :root { --bg:#F4F7FB; --card:#FFFFFF; --text:#13213A; --sub:#5B6B85; --accent:#1E6FD9; --line:#DCE3EE; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
      background:var(--bg); color:var(--text); padding:2rem 1rem; line-height:1.6; }
    main { max-width:28rem; margin:0 auto; background:var(--card); border-radius:20px; padding:2rem 1.5rem;
      box-shadow:0 4px 24px rgba(19,33,58,.08); text-align:center; }
    img.icon { width:84px; height:84px; border-radius:20px; }
    h1 { font-size:1.25rem; margin:.8rem 0 .2rem; }
    p { color:var(--sub); margin:.4rem 0; font-size:.95rem; }
    .code { font-family:ui-monospace,Menlo,monospace; font-size:1.5rem; letter-spacing:.08em; font-weight:700;
      background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:.6rem 1rem; margin:1rem 0 .4rem;
      user-select:all; -webkit-user-select:all; word-break:break-all; }
    .btn { display:block; width:100%; margin:.7rem 0 0; padding:.85rem 1rem; border-radius:14px; border:0;
      font-size:1rem; font-weight:700; text-decoration:none; cursor:pointer; }
    .primary { background:var(--accent); color:#fff; }
    .secondary { background:var(--bg); color:var(--accent); border:1px solid var(--line); }
    ol { text-align:left; color:var(--sub); font-size:.9rem; padding-left:1.3rem; margin:1.4rem 0 0; }
    .error { color:#B42318; }
    .note { margin-top:1.4rem; font-size:.85rem; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0E1524; --card:#18233A; --text:#EAF0FB; --sub:#9FB0CC; --accent:#5CA2FF; --line:#2A3A57; }
    }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="/icons/catchlog.png" alt="Catch Log">
    <h1>Catch Log のグループに招待されています</h1>
    <div id="invite" hidden>
      <p>招待コード</p>
      <div class="code" id="code"></div>
      <button class="btn secondary" id="copy" type="button">コードをコピー</button>
      <a class="btn primary" href="https://apps.apple.com/jp/app/catch-log/id6776291336" rel="noopener noreferrer">App Store でアプリを入手</a>
      <ol>
        <li>App Store から Catch Log をインストールします。</li>
        <li>アプリの「設定 → アカウント」でサインインします。</li>
        <li>このページに戻って下の「アプリで開いて参加する」を押すか、「設定 → グループ → 招待コードで参加」に上のコードを入力します。</li>
      </ol>
      <p class="note">インストール済みの方はこちら</p>
      <a class="btn secondary" id="open" href="#">アプリで開いて参加する</a>
    </div>
    <p id="invalid" class="error" hidden>招待コードが見つかりませんでした。招待してくれた方に、リンクをもう一度送ってもらってください。</p>
  </main>
  <script src="join.js"></script>
</body>
</html>
